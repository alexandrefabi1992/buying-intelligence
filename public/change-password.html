<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changer votre mot de passe — Buying Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        vs: { taupe:'#e6ded7', cream:'#f7f4ef', sage:'#a1aea3', emerald:'#213b39', brique:'#ad7460' },
      },
      fontFamily: { sans:['Inter','system-ui','sans-serif'], heading:['Poppins','Inter','sans-serif'] },
    }}};
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-vs-cream min-h-screen flex items-center justify-center p-6 font-sans">

<div class="bg-white rounded-xl shadow-lg max-w-md w-full p-8">
  <h1 class="text-2xl font-heading font-bold text-vs-emerald mb-2">Choisissez votre mot de passe</h1>
  <p class="text-sm text-gray-600 mb-6">
    Bienvenue ! Pour sécuriser votre compte, remplacez le mot de passe temporaire par le vôtre.
  </p>

  <div id="alert" class="hidden mb-4 p-3 rounded text-sm"></div>

  <form id="change-form" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe</label>
      <input name="new_password" type="password" required minlength="8" autocomplete="new-password"
             class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-vs-emerald" />
      <p class="text-xs text-gray-500 mt-1">Minimum 8 caractères.</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Confirmer</label>
      <input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"
             class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-vs-emerald" />
    </div>
    <button type="submit" id="submitBtn"
            class="w-full py-2 bg-vs-emerald text-white font-medium rounded hover:bg-vs-emerald/90 disabled:opacity-50">
      Enregistrer et continuer
    </button>
  </form>

  <p class="text-xs text-gray-400 mt-6 text-center">
    Vous serez redirigé vers le tableau de bord une fois le mot de passe changé.
  </p>
</div>

<script>
const BASE = ''; // same-origin
const TOKEN_KEY = 'auth_token';

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function alertMsg(text, kind = 'error') {
  const el = document.getElementById('alert');
  const colors = {
    success: 'bg-green-50 border border-green-200 text-green-800',
    error:   'bg-red-50 border border-red-200 text-red-800',
  };
  el.className = 'mb-4 p-3 rounded text-sm ' + colors[kind];
  el.textContent = text;
  el.classList.remove('hidden');
}

// Kick user back to login if no token (someone landed here without going through login)
if (!getToken()) { window.location.href = '/'; }

document.getElementById('change-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn  = document.getElementById('submitBtn');
  const data = Object.fromEntries(new FormData(form));

  if (data.new_password !== data.confirm_password) {
    alertMsg('Les deux mots de passe ne correspondent pas.');
    return;
  }
  if (data.new_password.length < 8) {
    alertMsg('Minimum 8 caractères.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ new_password: data.new_password }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      alertMsg(body.error ?? ('Erreur HTTP ' + res.status));
      return;
    }
    alertMsg('Mot de passe changé. Redirection…', 'success');
    setTimeout(() => { window.location.href = '/'; }, 1000);
  } catch (err) {
    alertMsg('Erreur réseau : ' + (err.message ?? err));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enregistrer et continuer';
  }
});
</script>
</body>
</html>
